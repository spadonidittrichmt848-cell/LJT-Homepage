# Build the personal homepage and publish it to GitHub Pages.
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Add nojekyll marker
        run: touch _site/.nojekyll
      - name: Publish built site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
      - name: Inspect and configure GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          set +e
          {
            echo "Current Pages configuration:"
            gh api repos/${{ github.repository }}/pages
            echo
            echo "Attempt to set gh-pages source:"
            gh api repos/${{ github.repository }}/pages --method PUT --input <(printf '%s' '{"source":{"branch":"gh-pages","path":"/"}}')
            echo
            echo "Pages configuration after attempt:"
            gh api repos/${{ github.repository }}/pages
          } > /tmp/pages-debug.txt 2>&1
          gh api repos/${{ github.repository }}/git/ref/heads/diagnostics >/dev/null 2>&1 || gh api repos/${{ github.repository }}/git/refs -f ref=refs/heads/diagnostics -f sha=${{ github.sha }}
          gh api repos/${{ github.repository }}/contents/pages-debug-${{ github.run_id }}.txt --method PUT -f message="Collect Pages configuration diagnostics" -f content="$(base64 -w0 /tmp/pages-debug.txt)" -f branch=diagnostics
