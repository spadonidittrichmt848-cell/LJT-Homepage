# Build the personal homepage and publish it to GitHub Pages.
name: Deploy Academic Pages template site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage"
        env:
          JEKYLL_ENV: production
      - name: Publish built site to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          touch _site/.nojekyll
          rm -rf /tmp/ljt-homepage-site
          cp -r _site /tmp/ljt-homepage-site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages
          git rm -r -q .
          git clean -fdx
          cp -r /tmp/ljt-homepage-site/. .
          git add -A
          git commit -m "Deploy personal homepage"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" gh-pages:gh-pages
      - name: Configure GitHub Pages to serve gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/${{ github.repository }}/pages --method PUT --input <(printf '%s' '{"source":{"branch":"gh-pages","path":"/"}}') || {
            gh api repos/${{ github.repository }}/pages --method DELETE || true
            gh api repos/${{ github.repository }}/pages --method POST --input <(printf '%s' '{"source":{"branch":"gh-pages","path":"/"}}')
          }
